# NPSE reproduction project -- default hyperparameters.
#
# The values in this file follow the original NPSE paper:
#   - VE SDE: dtheta = sigma_min * (sigma_min/sigma_max)^t * sqrt(2 log(sigma_max/sigma_min)) dW
#   - VP SDE: linear beta schedule with beta_min=0.1, beta_max=11.0
#   - Adam, lr=1e-4, 15% validation split, early-stopping patience of 1000 steps,
#     maximum 3000 training steps.
#   - Batch size 50 for budgets < 100000, 500 for budget 100000.
#   - Probability-flow ODE sampling with RK45 (torchdiffeq defaults tolerated).
#   - HPR epsilon = 5e-4 and 20000 posterior samples for density threshold estimation.

sde:
  # One of "ve" or "vp".
  type: ve
  # Integration horizon [0, T].
  T: 1.0

  # Variance-exploding (VE/SMLD) settings.
  ve:
    # sigma_min is task dependent: 0.01 for 2-D tasks, SIR and Two Moons,
    # 0.05 otherwise. This value can be overridden by benchmark configs.
    sigma_min: 0.05
    # sigma_max is auto-calibrated with Technique 1 of Song & Ermon (2020)
    # (max pairwise Euclidean distance on a subsample of theta). A numeric
    # value here overrides the automatic estimate.
    sigma_max: null

  # Variance-preserving (VP) settings.
  vp:
    beta_min: 0.1
    beta_max: 11.0

training:
  optimizer: adam
  learning_rate: 1.0e-4
  weight_decay: 0.0
  # Maximum training steps for non-sequential NPSE and each TSNPSE round.
  max_steps: 3000
  # Early stopping: stop if validation loss does not decrease for this many steps.
  patience: 1000
  validation_split: 0.15
  eval_every: 25
  gradient_clip_norm: 1.0
  # Score-matching weighting lambda(t). Default is g(t)^2.
  weighting: g2

  # Batch-size schedule. The paper uses 50 for budgets 1000/10000 and
  # 500 for budget 100000.
  batch_size:
    default: 50
    large_budget_threshold: 100000
    large_budget: 500

network:
  hidden_dim: 256
  num_layers: 3
  time_embedding_dim: 64
  # theta/x embedding output dim = max(30, 4*dim), handled in networks.py.

sampling:
  # Probability-flow ODE solver.
  method: rk45
  rtol: 1.0e-5
  atol: 1.0e-5
  # Fallback Euler integrator step count (used only if torchdiffeq is missing).
  euler_steps: 200

density:
  rtol: 1.0e-5
  atol: 1.0e-5
  # Number of Hutchinson trace samples for divergence estimation.
  hutchinson_samples: 1

hpr:
  # Truncation probability mass removed from the approximate posterior HPR.
  epsilon: 5.0e-4
  # Number of approximate posterior samples used to estimate the log-density
  # threshold.
  n_density_samples: 20000
  # Rejection-sampling batch size.
  batch_size: 512
  # Max candidate factor for rejection sampling.
  max_attempts_factor: 1000

tsnpse:
  # Number of sequential rounds (R in the paper).
  rounds: 10

# Default simulation budgets used by the benchmark experiments.
budgets: [1000, 10000, 100000]

# Reproducibility.
seed: 0

# Runtime options.
device: auto          # "auto", "cpu", or "cuda"
dtype: float32
