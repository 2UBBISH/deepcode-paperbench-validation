# SAPG default hyperparameters (base config).
# Task-specific configs override these values.

# ---- Run / bookkeeping ----
seed: 0
device: "cpu"            # "cuda" if available
log_dir: "runs/sapg"
run_name: "sapg"
total_iterations: 1000
checkpoint_every: 50
log_every: 1
save_checkpoint: true

# ---- Environment / parallelism ----
env:
  name: "allegrokuka"    # allegrokuka | shadow_hand | allegro_hand
  task: "regrasping"     # regrasping | throw | reorientation
  num_envs: 1024         # total parallel environments
  num_blocks: 8          # number of follower blocks (split)
  episode_length: 100
  control_dt: 0.016666666666666666
  action_scale: 0.5
  normalize_obs: true
  use_curriculum: true
  # reward weights (AllegroKuka)
  w_reach: 1.0
  w_lift: 1.0
  w_target: 1.0
  w_success: 5.0
  w_orientation: 1.0
  # curriculum
  initial_delta: 0.075   # 7.5 cm
  min_delta: 0.01        # 1 cm
  decrease_factor: 0.9   # -10%
  success_threshold: 3.0 # avg successes/episode to trigger decrease

# ---- SAPG aggregation ----
sapg:
  mode: "leader"          # leader | symmetric
  use_importance_weights: true
  max_importance_weight: 10.0
  phi_dim: 8              # dimension of per-follower/leader conditioning vector phi_j

# ---- PPO hyperparameters (AllegroKuka defaults) ----
ppo:
  gamma: 0.99
  tau: 0.95
  lr: 1.0e-4
  kl_threshold: 0.016
  grad_norm_clip: 1.0
  entropy_coeff: 0.0
  clip_eps: 0.1
  critic_coeff: 4.0
  bounds_loss_coeff: 1.0e-4
  action_bound: 1.0
  horizon: 16             # rollout horizon length
  lstm_seq_len: 16
  mini_epochs: 2
  mini_batch_size_mult: 4 # mini-batch size = num_envs * mult
  min_lr: 1.0e-6
  max_lr: 1.0e-2
  lr_scale: 1.5

# ---- Network architecture ----
network:
  hidden_sizes: [512, 512, 256, 128]
  use_lstm: false
  lstm_hidden: 768
  activation: "elu"
  learnable_sigma: true
  per_block_sigma: false   # entropy-exploration ablation
  init_log_std: 0.0
