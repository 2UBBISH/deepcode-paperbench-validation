# RICE configuration for the selfish-mining blockchain domain.
# Uses the pto-selfish-mining environment wrapped as a Gymnasium env.

name: "selfish_mining"
env_id: "SelfishMining-v0"

env_kwargs:
  alpha: 0.35
  gamma: 0.5
  max_steps: 1000
  whale_fee: 10.0
  whale_prob: 0.01
  normal_fee: 1.0

target:
  algorithm: "PPO"
  policy_type: "MlpPolicy"
  total_timesteps: 2_000_000
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_obs: false
  normalize_reward: false
  policy_kwargs:
    net_arch:
      - 128
      - 128
      - 128
      - 128
  eval_episodes: 50
  save_freq: 200000
  verbose: 1

mask:
  alpha: 1.0e-4
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 500_000
  hidden_sizes:
    - 64
    - 64
  use_action: false
  continuous_mask: true
  top_k: 500
  percentile: null
  eval_episodes: 50
  verbose: 1

rnd:
  output_dim: 64
  hidden_sizes:
    - 64
    - 64
  activation: "ReLU"
  normalize_inputs: true
  lambda_coef: 0.01

refine:
  p: 0.25
  lambda_coef: 0.01
  total_timesteps: 500_000
  learning_rate: 1.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  eval_episodes: 50
  save_freq: 100000
  verbose: 1

sample_budget: 500_000
fidelity_budgets:
  - 1
  - 2
  - 3
  - 5
  - 10
eval_episodes: 50

meta:
  description: "Selfish mining MDP with Adopt/Reveal/Mine actions and whale-transaction fee augmentation."
  action_names:
    - "adopt"
    - "reveal"
    - "mine"
