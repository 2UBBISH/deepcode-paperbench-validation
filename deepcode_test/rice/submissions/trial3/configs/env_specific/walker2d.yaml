# =============================================================================
# RICE Environment-Specific Configuration: Walker2d-v4
# =============================================================================
# Overrides default_mask.yaml and default_refine.yaml with values from
# Table 3 of the paper: p=0.25, λ=0.01, α=0.0001
# =============================================================================

# --- Environment Identification ---
env_name: "Walker2d-v4"
env_type: "mujoco"
state_dim: 17
action_dim: 6
max_episode_steps: 1000

# --- Mask Network Architecture ---
mask_network:
  hidden_sizes: [128, 128]
  activation: "tanh"

# --- Intrinsic Reward Coefficient for Mask Training ---
# α balances masking encouragement vs. performance (Table 3: α=0.0001 for all)
alpha: 0.0001

# --- PPO Hyperparameters for Mask Network Training ---
ppo:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 64

# --- Mask Network Training Loop ---
training:
  total_steps: 300000
  steps_per_iteration: 2048
  eval_interval: 10
  eval_episodes: 10
  save_interval: 50
  seed: 42

# --- Fidelity Evaluation ---
fidelity:
  num_episodes: 10
  q_function: null  # Use Monte Carlo returns if no Q-function provided

# --- Critical State Collection ---
critical_state:
  num_episodes: 100
  top_k_per_episode: 1
  max_critical_states: 100

# --- Mixed Initial Distribution ---
# Table 3: Walker2d p=0.25
mixed_init:
  p_mixed: 0.25

# --- RND Exploration Bonus ---
# Table 3: Walker2d λ=0.01
rnd:
  lambda_coef: 0.01
  hidden_sizes: [64, 64]
  embedding_dim: 64
  activation: "relu"
  learning_rate: 1.0e-4
  normalize_obs: true
  obs_rms_decay: 0.99
  normalize_bonus: true
  bonus_decay: 0.99
  update_epochs: 4
  batch_size: 256

# --- PPO Hyperparameters for Refining Phase ---
refine_ppo:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 64
  normalize_advantages: true
  normalize_obs: true

# --- Policy Architecture for Refining ---
policy:
  hidden_sizes: [64, 64]
  value_hidden_sizes: [64, 64]
  policy_std: 0.0  # 0 = learned (state-dependent), >0 = fixed
  activation: "tanh"

# --- Refining Training Loop ---
refine_training:
  total_steps: 1000000
  steps_per_iteration: 2048
  eval_interval: 10
  eval_episodes: 10
  eval_max_steps: 1000
  save_interval: 50
  seed: 42

# --- Device ---
device: "cuda"

# --- Logging ---
logging:
  verbose: true
  log_dir: "./logs/walker2d"
  use_tensorboard: false