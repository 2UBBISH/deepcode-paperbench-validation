# =============================================================================
# RICE Configuration: Autonomous Driving (MetaDrive Macro-v1)
# =============================================================================
# Environment-specific hyperparameters for the autonomous driving domain.
# Overrides default_mask.yaml and default_refine.yaml.
# Reference: Table 3 in RICE paper (p=0.25, λ=0.01, α=0.0001)

# --- Environment Info ---
env_name: "MetaDrive-Macro-v1"
env_type: "metadrive"
state_dim: 259          # MetaDrive default observation (lidar + state)
action_dim: 2           # steering, acceleration/braking
max_episode_steps: 1000
discrete_action: false

# --- Mask Network Training ---
mask_network:
  hidden_sizes: [256, 256]   # Larger network for high-dim observations
  activation: "tanh"

alpha: 0.0001                # Intrinsic reward coefficient (Table 3)

ppo:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 64

training:
  total_steps: 500000        # More steps for complex driving task
  steps_per_iteration: 2048
  eval_interval: 10
  eval_episodes: 10
  save_interval: 50
  seed: 42

fidelity:
  num_episodes: 10
  q_function: null

# --- Critical State Collection ---
critical_state:
  num_episodes: 100
  top_k_per_episode: 1
  max_critical_states: 100

# --- Mixed Initial Distribution ---
mixed_init:
  p_mixed: 0.25              # From Table 3

# --- RND Exploration Bonus ---
rnd:
  lambda_coef: 0.01          # From Table 3
  hidden_sizes: [64, 64]
  embedding_dim: 64
  activation: "relu"
  learning_rate: 1.0e-4
  normalize_obs: true
  obs_rms_decay: 0.99
  normalize_bonus: true
  bonus_decay: 0.99
  update_epochs: 4
  batch_size: 256

# --- Refining PPO ---
refine_ppo:
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  ppo_epochs: 10
  batch_size: 64
  normalize_advantages: true
  normalize_obs: true

# --- Policy Architecture (for refining) ---
policy:
  hidden_sizes: [256, 256]   # Match target policy
  value_hidden_sizes: [256, 256]
  activation: "tanh"
  policy_std: 0.0            # Learned std

# --- Refining Training Loop ---
refine_training:
  total_steps: 2000000       # 2M steps for autonomous driving
  steps_per_iteration: 2048
  eval_interval: 10
  eval_episodes: 10
  eval_max_steps: 1000
  save_interval: 50
  seed: 42

# --- Device ---
device: "cuda"

# --- Logging ---
logging:
  verbose: true
  log_dir: "./logs/autonomous_driving"
  use_tensorboard: false