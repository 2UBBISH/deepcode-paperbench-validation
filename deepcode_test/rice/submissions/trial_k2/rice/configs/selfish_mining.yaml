# RICE hyper-parameters for the selfish-mining blockchain task.
# The environment is a simplified selfish-mining MDP based on Bar-Zur et al.
# State: [a, b, fork, total_mined, attacker_blocks] (5-D)
# Actions: Mine + Adopt(0..max_chain) + Reveal(1..max_chain)

defaults:
  seed: 0
  device: "auto"
  n_seeds: 5
  output_root: "./checkpoints/selfish_mining"

target:
  algorithm: "PPO"
  total_timesteps: 2_000_000
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sb3: false          # custom PyTorch policy is used for the fixed [128,128,128,128] MLP
  policy_kwargs:
    net_arch: [128, 128, 128, 128]
    activation_fn: "Tanh"
  env_kwargs:
    alpha: 0.35
    gamma: 0.5
    max_steps: 500
    max_chain: 10
    whale_prob: 0.01
    whale_fee: 10.0
    normal_fee: 1.0
    block_reward: 1.0

mask:
  total_timesteps: 500_000
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  alpha: 1.0e-4           # blinding bonus coefficient r_mask = r_env + alpha*(1 - xi(s))
  match_target_arch: true # MaskNet uses the same 4-layer [128,128,128,128] MLP

critical_buffer:
  n_trajectories: 200
  selection_mode: "top_p"
  top_p: 0.25
  threshold: 0.5
  capacity: 5000

refine:
  total_timesteps: 1_000_000
  p: 0.5                  # probability of resetting from a critical state
  lambda_rnd: 0.01        # RND bonus scale: r_refine = r_env + lambda_rnd * b_RND(s)
  rnd:
    output_dim: 128
    hidden_sizes: [128, 128]
    activation: "Tanh"
    lr: 1.0e-4
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  warm_start: true        # initialize pi' from the frozen target policy

eval:
  n_episodes: 500
  deterministic: true
  compute_fidelity: true
  fidelity:
    n_episodes: 50
    n_samples: 200
    n_action_samples: 8

envs:
  selfish_mining:
    normalize_obs: false
    target:
      total_timesteps: 2_000_000
    mask:
      total_timesteps: 500_000
    refine:
      p: 0.5
      lambda_rnd: 0.01
