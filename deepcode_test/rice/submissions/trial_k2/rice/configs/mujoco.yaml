# RICE configuration for dense MuJoCo locomotion tasks
# Tasks: Hopper-v3, Walker2d-v3, Reacher-v2, HalfCheetah-v3

# -----------------------------------------------------------------------------
# Common hyper-parameters
# -----------------------------------------------------------------------------
defaults:
  seed: 0
  device: auto
  n_seeds: 5

# -----------------------------------------------------------------------------
# Target policy training (Stage 1)
# -----------------------------------------------------------------------------
target:
  algorithm: ppo
  backend: sb3  # use Stable-Baselines3 for MuJoCo target training
  total_timesteps: 2_000_000
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true

# -----------------------------------------------------------------------------
# Mask network training (Stage 2)
# -----------------------------------------------------------------------------
mask:
  total_timesteps: 500_000
  alpha: 1.0e-4  # default blinding bonus coefficient (Table 3)
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true

# -----------------------------------------------------------------------------
# Critical-state buffer construction
# -----------------------------------------------------------------------------
critical_buffer:
  n_trajectories: 100
  selection_mode: top_p
  top_p: 0.25
  threshold: 0.5
  capacity: 10000

# -----------------------------------------------------------------------------
# Refinement (Stage 3)
# -----------------------------------------------------------------------------
refine:
  total_timesteps: 1_000_000
  p: 0.5  # mixed-reset probability (Table 3)
  lambda_rnd: 0.01  # RND bonus scale (Table 3)
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true
  rnd_output_dim: 128
  rnd_hidden_sizes: [64, 64]
  rnd_lr: 1.0e-4
  rnd_update_proportion: 1.0

# -----------------------------------------------------------------------------
# Evaluation
# -----------------------------------------------------------------------------
eval:
  n_episodes: 500
  deterministic: true
  compute_fidelity: true
  fidelity_n_episodes: 50
  fidelity_n_samples: 200
  fidelity_n_action_samples: 8

# -----------------------------------------------------------------------------
# Per-environment overrides
# -----------------------------------------------------------------------------
envs:
  Hopper-v3:
    target:
      total_timesteps: 2_000_000
    refine:
      p: 0.5
      lambda_rnd: 0.01

  Walker2d-v3:
    normalize_obs: true
    target:
      total_timesteps: 2_000_000
    refine:
      p: 0.5
      lambda_rnd: 0.01

  Reacher-v2:
    target:
      total_timesteps: 1_000_000
      learning_rate: 3.0e-4
    mask:
      total_timesteps: 300_000
    refine:
      p: 0.25
      lambda_rnd: 0.001
      total_timesteps: 500_000

  HalfCheetah-v3:
    normalize_obs: true
    target:
      total_timesteps: 2_000_000
    refine:
      p: 0.5
      lambda_rnd: 0.01
