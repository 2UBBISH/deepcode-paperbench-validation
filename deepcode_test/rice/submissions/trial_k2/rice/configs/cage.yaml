# RICE configuration for CAGE Challenge 2 (CybORG blue-vs-red).
# Trains a PPO blue agent against the B-line red agent using the champion
# wrapper scheme.  Evaluation aggregates trials of length 30, 50 and 100 and
# reports the average reward across the three lengths.

defaults:
  seed: 0
  device: "auto"
  n_seeds: 5
  output_root: "./checkpoints/cage"

# ---------------------------------------------------------------------------
# Target policy training
# ---------------------------------------------------------------------------
target:
  algo: "PPO"
  total_timesteps: 2_000_000
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sb3: true
  normalize_obs: false
  policy_kwargs:
    net_arch: [64, 64]
  env_kwargs:
    scenario_path: null          # use default CybORG Scenario2
    red_agent: "B-line"
    trial_lengths: [30, 50, 100]
    use_mock: false

# ---------------------------------------------------------------------------
# Mask network training
# ---------------------------------------------------------------------------
mask:
  total_timesteps: 500_000
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  alpha: 1.0e-4                  # blinding bonus coefficient
  match_target_arch: true
  policy_kwargs:
    net_arch: [64, 64]

# ---------------------------------------------------------------------------
# Critical-state buffer construction
# ---------------------------------------------------------------------------
critical_buffer:
  n_trajectories: 200
  selection_mode: "top_p"        # or "threshold"
  top_p: 0.25
  threshold: 0.5
  capacity: null                 # keep all selected states
  max_steps_per_episode: null

# ---------------------------------------------------------------------------
# Refinement with mixed resets + RND
# ---------------------------------------------------------------------------
refine:
  total_timesteps: 1_000_000
  p: 0.50                        # probability of critical-state reset
  lambda_rnd: 0.01               # RND bonus scale
  warm_start: true               # initialize refined policy from target
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  rnd:
    output_dim: 128
    hidden_sizes: [64, 64]
    lr: 1.0e-4
    update_proportion: 1.0

# ---------------------------------------------------------------------------
# Evaluation
# ---------------------------------------------------------------------------
eval:
  n_episodes: 500
  deterministic: true
  fidelity:
    n_episodes: 50
    n_samples: 200
    n_action_samples: 8

# ---------------------------------------------------------------------------
# Per-task overrides
# ---------------------------------------------------------------------------
envs:
  cage:
    normalize_obs: false
    target_total_timesteps: 2_000_000
    mask_total_timesteps: 500_000
    refine_total_timesteps: 1_000_000
