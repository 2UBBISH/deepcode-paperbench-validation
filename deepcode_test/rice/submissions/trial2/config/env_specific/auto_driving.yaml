# =============================================================================
# Environment-Specific Configuration: Autonomous Driving (MetaDrive Macro-v1)
# =============================================================================
# Overrides default.yaml for the MetaDrive autonomous driving environment.
# Reference: RICE paper Tables 3, 4, 7.
# Mask training samples: 2.44×10⁶ (Table 4)
# =============================================================================

# --- Agent Training (PPO) ---
agent:
  policy: "MlpPolicy"
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 3.0e-4
  total_timesteps: 2000000          # 2M timesteps for auto driving
  normalize_obs: true
  normalize_reward: true
  net_arch:
    pi: [128, 128, 128, 128]        # 4-layer MLP, 128 hidden (non-MuJoCo)
    vf: [128, 128, 128, 128]
  activation_fn: "tanh"
  use_sde: false
  sde_sample_freq: -1

# --- Mask Network Training ---
mask:
  alpha: 0.0001                     # Intrinsic reward coefficient
  total_timesteps: 2440000          # 2.44×10⁶ samples (Table 4)
  hidden_sizes: [128, 128, 128, 128]
  features_dim: 128
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  activation_fn: "tanh"
  use_layer_norm: false

# --- Explanation Extraction ---
explanation:
  num_trajectories: 100
  max_steps: 1000
  buffer_size: 10000
  top_k_per_trajectory: 1
  deterministic_agent: true
  use_perturbed_policy: false

# --- Random Network Distillation (RND) ---
rnd:
  embedding_dim: 128
  hidden_sizes: [128, 128, 128, 128]
  learning_rate: 1.0e-4
  normalize_obs: true
  clip_bonus: null
  obs_rms: null

# --- Refining Process ---
refining:
  p: 0.5                            # Probability of resetting to critical state
  lambda: 0.01                      # RND bonus coefficient
  total_timesteps: 1000000          # 1M refining timesteps
  use_rnd: true
  use_mixed_init: true
  ppo_learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  rnd_update_freq: 1000
  rnd_batch_size: 64
  rnd_n_epochs: 1
  state_buffer_size: 100000
  eval_freq: 10000
  n_eval_episodes: 10
  save_freq: 100000

# --- Experiment Settings ---
experiment:
  eval_episodes: 100
  eval_freq: 10000
  num_seeds: 5
  max_steps: 1000
  save_videos: false
  deterministic_eval: true

# --- Environment-Specific Keyword Arguments ---
env_kwargs:
  max_steps: 1000
  reward_scale: 1.0
  # MetaDrive default config is handled inside auto_driving_env.py
  # Additional MetaDrive-specific parameters can be passed here:
  #   map: "S"  # Map type
  #   traffic_density: 0.1
  #   horizon: 1000