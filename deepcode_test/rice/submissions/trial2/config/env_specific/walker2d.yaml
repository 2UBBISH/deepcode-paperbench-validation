# Environment-specific hyperparameters for Walker2d-v3 (MuJoCo)
# Overrides default.yaml values for the Walker2d locomotion task.
# Values taken from RICE paper Tables 3, 4, 5, and 6.

# Agent training (PPO)
agent:
  env_id: "Walker2d-v3"
  policy: "MlpPolicy"
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 3.0e-4
  net_arch:
    pi: [64, 64]
    vf: [64, 64]
  activation_fn: "tanh"
  total_timesteps: 1000000  # 1e6
  normalize_obs: true
  normalize_reward: true

# Mask network training
mask:
  alpha: 0.0001
  total_timesteps: 300000  # 3×10⁵ (Table 4)
  hidden_sizes: [64, 64]
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  features_dim: 64
  use_layer_norm: false

# Explanation extraction
explanation:
  num_trajectories: 100
  max_steps: 1000
  buffer_size: 10000
  top_k_per_trajectory: 1
  deterministic_agent: true
  use_perturbed_policy: false

# Random Network Distillation
rnd:
  embedding_dim: 128
  hidden_sizes: [64, 64]
  learning_rate: 1.0e-4
  normalize_obs: true
  clip_bonus: null

# Refining process (Table 3: p=0.5, λ=0.01 for Walker2d)
refining:
  p: 0.5
  lambda: 0.01
  total_timesteps: 1000000  # 1e6
  use_rnd: true
  use_mixed_init: true
  ppo_learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  rnd_update_freq: 1000
  rnd_batch_size: 64
  rnd_n_epochs: 1
  state_buffer_size: 100000
  eval_freq: 10000
  save_freq: 100000

# Experiment evaluation
experiment:
  eval_episodes: 100
  eval_freq: 10000
  num_seeds: 5
  max_steps: 1000
  save_videos: false