# Selfish Mining environment-specific hyperparameters
# Overrides default.yaml for the blockchain selfish mining task (Bar-Zur et al. 2023)
# Reference: RICE paper Tables 3, 4, 7

agent:
  # PPO hyperparameters for base agent training on SelfishMining-v0
  policy: "MlpPolicy"
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  learning_rate: 3.0e-4
  use_sde: false
  sde_sample_freq: -1
  normalize_advantage: true
  target_kl: null
  policy_kwargs:
    net_arch:
      pi: [128, 128, 128, 128]   # 4-layer MLP, hidden size 128
      vf: [128, 128, 128, 128]
    activation_fn: "tanh"
    ortho_init: true
  total_timesteps: 2000000        # 2M timesteps for selfish mining
  normalize: true
  normalize_obs: true
  normalize_reward: true

mask:
  # Mask network training hyperparameters
  alpha: 0.0001                   # Intrinsic reward coefficient for blinding
  total_timesteps: 1500000        # 1.5×10⁶ samples (Table 4)
  hidden_sizes: [128, 128, 128, 128]  # Same architecture as agent policy
  features_dim: 128
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  use_sde: false
  deterministic_agent: false

explanation:
  # Critical state extraction parameters
  num_trajectories: 100
  max_steps: 500                  # Selfish mining episodes are shorter
  buffer_size: 10000
  use_perturbed_policy: false
  deterministic_agent: true
  top_k_per_trajectory: 1

rnd:
  # Random Network Distillation parameters
  embedding_dim: 128
  hidden_sizes: [128, 128, 128, 128]
  learning_rate: 1.0e-4
  normalize_obs: true
  clip_bonus: null

refining:
  # Refining process hyperparameters
  p: 0.5                          # Probability of sampling from critical state buffer
  lambda: 0.01                    # RND exploration bonus coefficient
  total_timesteps: 1000000        # 1M refining timesteps
  use_rnd: true
  use_mixed_init: true
  ppo_learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  rnd_update_freq: 1000
  rnd_batch_size: 64
  rnd_n_epochs: 1
  state_buffer_size: 100000
  eval_freq: 10000
  n_eval_episodes: 10
  save_freq: 100000

experiment:
  # Evaluation and experiment settings
  eval_episodes: 100
  eval_freq: 10000
  num_seeds: 5
  max_steps: 500
  save_videos: false
  deterministic_eval: true

# Environment-specific parameters for SelfishMiningEnv
env_kwargs:
  alpha: 0.35                     # Hash power fraction (0 < alpha < 0.5)
  gamma: 0.5                      # Honest adoption fraction
  max_chain_length: 100
  max_steps: 500
  reward_scale: 1.0