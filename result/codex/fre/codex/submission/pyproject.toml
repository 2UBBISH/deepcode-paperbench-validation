[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fre"
version = "0.1.0"
description = "Reproduction of Unsupervised Zero-Shot RL via Functional Reward Encodings (ICML 2024)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<2.0",
]

[tool.setuptools]
packages = ["fre", "fre.tasks", "fre.utils", "baselines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
