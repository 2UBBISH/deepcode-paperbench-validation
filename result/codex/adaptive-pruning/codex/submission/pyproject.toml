[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-pruning"
version = "1.0.0"
description = "Reproduction of APT: Adaptive Pruning and Tuning Pretrained Language Models (ICML 2024)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "transformers>=4.36",
    "datasets>=2.16",
    "accelerate>=0.27",
    "numpy>=1.24",
]

[project.optional-dependencies]
eval = ["scipy>=1.10", "scikit-learn>=1.3", "rouge_score>=0.1.2", "pandas>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["apt", "baselines", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore"]
