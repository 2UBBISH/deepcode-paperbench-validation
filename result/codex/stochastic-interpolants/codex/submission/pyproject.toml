[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "si-couplings"
version = "1.0.0"
description = "Stochastic interpolants with data-dependent couplings (ICML 2024 reproduction)"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.23",
    "scipy>=1.9",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
include = ["si_couplings*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
