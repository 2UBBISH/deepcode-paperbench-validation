# Tiny CPU configuration used by the end-to-end smoke test / pipeline check
task: inpainting
seed: 0
interpolant: linear_zero_gamma

coupling:
  name: inpainting
  n_tiles: 4
  p_missing: 0.3
  channels: 3

data:
  kind: synthetic
  image_size: 32
  channels: 3
  num_classes: 4
  n: 512
  num_workers: 0

model:
  kind: unet
  dim: 32
  dim_mults: [1, 2]
  resnet_block_groups: 8
  learned_sinusoidal_cond: true
  learned_sinusoidal_dim: 16
  attn_dim_head: 16
  attn_heads: 2
  attn_resolutions: [8, 16]
  image_size: 32
  num_classes: 4
  data_channels: 3

optim:
  batch_size: 8
  lr: 1.0e-3
  max_steps: 50
  log_every: 10
  save_every: 50

sampling:
  method: euler
  steps: 20

out_dir: runs/smoke_synthetic
