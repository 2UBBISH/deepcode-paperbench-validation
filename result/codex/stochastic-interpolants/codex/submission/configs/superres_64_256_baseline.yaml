# Super-resolution 64x64 -> 256x256 with an independent Gaussian base.
#
# This is the uncoupled counterpart of the previous configuration: the model
# still receives the up-sampled low-resolution image xi = U(D(x_1)) as extra
# input channels, but the base density is the data-agnostic rho_0 = N(0, Id)
# with x_0 independent of x_1, which isolates the effect of the coupling.
task: super_resolution
seed: 0
interpolant: linear

coupling:
  name: super_resolution_baseline
  scale: 4
  sigma: 0.5
  base_scale: 1.0

data:
  kind: imagenet
  name: imagenet-1k
  image_size: 256
  channels: 3
  num_classes: 1000
  num_workers: 8

model:
  kind: unet_imagenet
  dim: 256
  dim_mults: [1, 1, 2, 3, 4]
  resnet_block_groups: 8
  learned_sinusoidal_cond: true
  learned_sinusoidal_dim: 32
  random_fourier_features: false
  attn_dim_head: 64
  attn_heads: 4
  attn_resolutions: [16, 32]
  image_size: 256
  num_classes: 1000
  data_channels: 3
  time_scale: 1000.0

optim:
  batch_size: 32
  lr: 2.0e-4
  lr_decay_every: 1000
  lr_decay_gamma: 0.99
  weight_decay: 0.0
  grad_clip_norm: 10000.0
  max_steps: 200000
  ema: true
  ema_beta: 0.995
  log_every: 50
  save_every: 5000

sampling:
  method: dopri5
  steps: 250
  guidance_scale: 1.0

out_dir: runs/superres_64_256_baseline
