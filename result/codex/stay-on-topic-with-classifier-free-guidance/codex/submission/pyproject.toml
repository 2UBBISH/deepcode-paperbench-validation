[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfglm"
version = "0.1.0"
description = "Classifier-Free Guidance for autoregressive language models (reproduction of Sanchez et al., ICML 2024)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=1.13",
    "transformers>=4.30",
    "datasets>=2.12",
    "numpy>=1.23",
    "scipy>=1.9",
]

[tool.setuptools]
packages = ["cfglm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
