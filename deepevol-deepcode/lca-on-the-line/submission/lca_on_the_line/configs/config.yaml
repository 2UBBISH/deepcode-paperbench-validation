  VIT_L_32: vit_l_32
  mnasnet: mnasnet1_0
  regnet: regnet_y_1_6gf
  wide_resnet: wide_resnet101_2
  swin: swin_b

# -----------------------------------------------------------------------------
# Table reference values (used only for gating / sanity checks; never fitted)
# -----------------------------------------------------------------------------
references:
  table2:
    # ID LCA vs OOD Top-1 correlations
    s:         {r2: 0.816, pea: 0.903}
    r:         {r2: 0.779, pea: 0.883}
    a:         {r2: 0.704, pea: 0.839}
    objectnet: {r2: 0.915, pea: 0.956}
    v2:        {r2: 0.339, pea: 0.582}
  table2_baseline_id_top1:
    # ID Top-1 collapses on severe shift
    s: {r2: 0.075}
    r: {r2: 0.020}
    a: {r2: 0.009}
  table3:
    # MAE of predicted OOD Top-1
    id_lca:    {v2: 0.162, s: 0.093, r: 0.114, a: 0.103, objectnet: 0.048}
    id_top1:   {s: 0.230, r: 0.277, a: 0.192, objectnet: 0.178}
  table4:
    # mean PEA across the 75 latent hierarchies
    pea:
      v2: 0.815
      s: 0.773
      r: 0.712
      a: 0.662
      objectnet: 0.930
  table8:
    # per-model ID/OOD (LCA, ELCA, Top1) spot checks
    resnet18:    {id_lca: 3.05, id_top1: 0.698}
    resnet50:    {id_lca: 2.89, id_top1: 0.733}
    clip_rn50:   {id_lca: 2.55, id_top1: 0.579}
    clip_rn50x4: {id_lca: 2.42, id_top1: 0.641}
  table14:
    # CLIP-ViT32 zero-shot Top-1 with taxonomy prompts
    imagenet:
      baseline: 0.589
      taxonomy_parent: 0.626
