# SAPG config for AllegroHand (16-DoF in-hand reorientation) — Appendix A / Tables 2-4
# Easy task: metric = episode reward. phi_dim=16, horizon=8, clip=0.2.

task: allegrohand
num_envs: 24576
horizon: 8
episode_length: 1000
recurrent: false

# --- Architecture (Sec 4.4 / Addendum) ---
phi_dim: 16
actor_mlp: [512, 256, 128]
critic_mlp: [512, 256, 128]
activation: elu
init_log_std: -1.0

# --- PPO / optimization ---
gamma: 0.99
tau: 0.95
n_step: 3
clip_eps: 0.2              # AllegroHand uses clip 0.2
lam: 1.0
critic_coef: 4.0
entropy_coef: 0.0          # best sigma for AllegroHand is 0 (Sec 4.5)
learning_rate: 3.0e-4
kl_threshold: 0.016
kl_min_lr: 1.0e-5
kl_max_lr: 1.0e-2
mini_epochs: 5             # easy tasks use 5 mini-epochs
num_mini_batches: 4
grad_norm_clip: 1.0
normalize_advantage: true
value_clip: null

# --- SAPG aggregation ---
num_policies: 6
aggregation: leader_follower
subsample: true

# --- Training budget ---
target_transitions: 2.0e10
seed: 0
device: cuda
output_dir: runs/sapg_allegrohand
log_interval: 1
save_interval: 100
