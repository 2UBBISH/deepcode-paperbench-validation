# Configuration for the 1D Convection PDE (Appendix A)
#   du/dt + beta * du/dx = 0,  x in (0, 2*pi), t in (0, 1)
#   IC: u(x, 0) = sin(x)
#   Periodic BC: u(0, t) = u(2*pi, t)
#   Exact: u(x, t) = sin(x - beta * t)

name: convection

# PDE parameters passed to src.pdes.Convection(**pde_kwargs)
pde_kwargs:
  beta: 40.0

# Spatial / temporal domain (informational; authoritative values live in pdes.py)
domain:
  x_min: 0.0
  x_max: 6.283185307179586   # 2*pi
  t_min: 0.0
  t_max: 1.0

# Data sampling (Section 2.2)
data:
  n_res: 10000     # randomly sampled interior collocation points
  n_ic: 257        # equally spaced initial-condition points
  n_bc: 101        # equally spaced boundary points per boundary
  n_x_grid: 255    # evaluation grid resolution in x
  n_t_grid: 100    # evaluation grid resolution in t

# Training budget
training:
  total_iters: 41000
  switch_iters: [1000, 11000, 31000]
  default_switch: 11000
  lbfgs_memory: 100

# Learning-rate grids used for tuning (Section 4)
lr_grid:
  adam: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
  lbfgs: [1.0]
  adam_lbfgs: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]

# Best learning rate selected by smallest final L2RE (Table 1 / Figure 3 config)
best_lr:
  adam: 1.0e-4
  lbfgs: 1.0
  adam_lbfgs: 1.0e-4

# Spectral-density analysis config (Figures 3 & 7)
spectral:
  width: 200
  switch_iter: 11000
  lr: 1.0e-4
  seeds: [345, 456, 567]
  num_matvecs: 100
  num_bins: 200

# NNCG fine-tuning config (Table 2, Figures 1/4/5)
nncg:
  steps: 2000
  mu_grid: [1.0e-2, 1.0e-1]
  s: 60
  F: 20
  M: 1000
  eps: 1.0e-16
  eta: 1.0
  alpha: 0.1
  beta: 0.5
