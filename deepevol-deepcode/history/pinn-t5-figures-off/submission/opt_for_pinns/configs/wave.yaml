# Configuration for the 1D Wave PDE experiment (Appendix A).
#   d2u/dt2 - 4 * d2u/dx2 = 0,  x in (0, 1), t in (0, 1)
#   IC: u(x, 0) = sin(pi x) + 0.5 sin(beta pi x),  du/dt(x, 0) = 0
#   Dirichlet BC: u(0, t) = u(1, t) = 0
#   beta = 5

name: wave

pde_kwargs:
  beta: 5.0

# Informational only -- authoritative bounds live in src/pdes.py
domain:
  x_min: 0.0
  x_max: 1.0
  t_min: 0.0
  t_max: 1.0

data:
  n_res: 10000
  n_ic: 257
  n_bc: 101
  n_x_grid: 255
  n_t_grid: 100

training:
  total_iters: 41000
  switch_iters: [1000, 11000, 31000]
  default_switch: 11000
  lbfgs_memory: 100

lr_grid:
  adam: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]
  lbfgs: [1.0]
  adam_lbfgs: [1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1]

# Selected by smallest final L2RE (see run_experiments.tune_lr)
best_lr:
  adam: 1.0e-3
  lbfgs: 1.0
  adam_lbfgs: 1.0e-3

spectral:
  width: 200
  switch_iter: 11000
  lr: 1.0e-3
  seeds: [345, 456, 567]
  num_matvecs: 100
  num_bins: 200

nncg:
  steps: 2000
  mu_grid: [1.0e-2, 1.0e-1]
  s: 60
  F: 20
  M: 1000
  eps: 1.0e-16
  eta: 1.0
  alpha: 0.1
  beta: 0.5
