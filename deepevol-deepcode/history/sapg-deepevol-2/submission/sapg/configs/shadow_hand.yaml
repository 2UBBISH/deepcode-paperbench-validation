# ShadowHand (24-DoF) in-hand cube reorientation configuration.
# Encodes Table 3 hyperparameters from the SAPG paper.
# Inherits all unspecified keys from configs/default.yaml.
defaults:
  - default

# ---------------------------------------------------------------------------
# Environment / parallelism
# ---------------------------------------------------------------------------
env_name: shadow_hand
task: reorientation
num_envs: 4096
num_workers: 8
envs_per_worker: null          # computed as num_envs // num_workers
horizon: 32
max_iterations: 2000
seed: 0
device: cuda
control_freq: 20
episode_length: 300

# ---------------------------------------------------------------------------
# Optimization (Table 3)
# ---------------------------------------------------------------------------
gamma: 0.99
tau: 0.95
clip_epsilon: 0.1              # AllegroKuka / ShadowHand use 0.1
critic_coef: 4.0               # lambda'
entropy_coef: 0.0
bounds_loss_coef: 0.0001
max_grad_norm: 1.0
learning_rate: 0.0003
num_learning_epochs: 5
mini_batch_size: null          # computed as num_envs * 4
num_mini_batches: null
kl_target: 0.016
use_kl_adaptive_lr: true
normalize_advantage: true
normalize_value: true

# ---------------------------------------------------------------------------
# Network architecture (Table 3): MLP(512x512x256x128, ELU) -> mean head
# ---------------------------------------------------------------------------
use_lstm: false
seq_len: 16
lstm_hidden: 768
lstm_layers: 1
hidden_dims: [512, 512, 256, 128]
critic_hidden_dims: [512, 512, 256, 128]
embed_dim: 16
activation: elu
condition_mode: concat
init_log_std: -1.0
use_tanh: false

# ---------------------------------------------------------------------------
# Aggregation (SAPG core)
# ---------------------------------------------------------------------------
aggregation_mode: leader
leader_id: 0
rotate_leader: false
use_entropy_exploration: false

# ---------------------------------------------------------------------------
# Curriculum (success-tolerance delta schedule)
# ---------------------------------------------------------------------------
use_curriculum: true
curriculum_initial_tolerance: 0.5
curriculum_min_tolerance: 0.1
curriculum_decay: 0.9
curriculum_success_threshold: 3.0

# ---------------------------------------------------------------------------
# Reward weights
# ---------------------------------------------------------------------------
w1: 1.0
r_lift_w: 1.0
r_target_w: 1.0
r_success_w: 10.0

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
log_interval: 10
save_interval: 100
eval_interval: 50
output_dir: runs/shadow_hand
wandb: false
