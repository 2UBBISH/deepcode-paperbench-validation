[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snpse-reproduction-implementation"
version = "0.1.0"
description = "Reproduction implementation for Sequential Neural Score Estimation"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.2.0",
    "numpy==1.26.4",
    "scipy==1.11.4",
    "sbibm==1.0.5",
    "sbi==0.22.0",
]
