# --- ID / OOD split of P3-Test (Appendix B) -------------------------------
# Appendix B: ID = {SuperGlue-Cb, SuperGlue-RTE, SuperGlue-wsc.fixed,
#                   SuperGlue-Copa, SuperGlue-wic}
#               OOD = {storycloze, hellaswag, anli, winogrande-xl}
# NOTE: the Clarifications list "anli" among D_R tasks; Appendix B assigns
#       "anli" to the out-of-domain split -> we follow Appendix B for OOD.
id_tasks:
  - super_glue-cb
  - super_glue-rte
  - super_glue-wsc.fixed
  - super_glue-copa
  - super_glue-wic
ood_tasks:
  - storycloze
  - hellaswag
  - anli
  - winogrande-winogrande_xl

# ---------------------------------------------------------------------------
# PromptSource template hints: prefer the *_score_eval / eval variants where
# available. If a task name has no template in the installed promptsource
# revision, the loader falls back to the first available template.
# ---------------------------------------------------------------------------
prefer_template_substrings:
  - "score_eval"
  - "eval"

# P3 splits per task family (used only when the aggregation script needs to
# know which config/split pair to request).
task_splits:
  forward: train
  classification: train
  bart0_r: test
  mmlu: validation
