# ---------------------------------------------------------------------------
# Qualitative claims checked by `direction_checks()` in the driver
# ---------------------------------------------------------------------------
expected_directions:
  lbcs_size_below_k: true                       # PAPER: LBCS reports a coreset size smaller than the predefined k
  lbcs_best_or_competitive_accuracy: true       # PAPER: "LBCS obtains the best accuracy ... most of the time"
  lbcs_always_best_on_svhn: true                # PAPER: "for SVHN, our method always achieves the best test accuracy"
  larger_k_higher_accuracy: true                # PAPER: accuracy increases with the predefined size
  svhn_k1000_size: 970.0                        # PAPER: anchor (Table 2, SVHN, k=1000)
  cifar10_k4000_size: 3736.0                    # PAPER: anchor (Table 2, CIFAR-10, k=4000)

# ---------------------------------------------------------------------------
# Fast CPU smoke-test overrides (`--smoke`)
# ---------------------------------------------------------------------------
smoke:
  datasets: [F-MNIST]
  ks: [200]
  repeats: 1
  T: 20
  inner_epochs: 1
  target_epochs: 1
  batch_size: 64
  eval_batch_size: 128
  methods: [Uniform, Moderate, Probabilistic]
  save_artifacts: false
  plot: false
  verbose: false

# ---------------------------------------------------------------------------
# Explicitly out-of-scope paper sections (never executed)
# ---------------------------------------------------------------------------
out_of_scope:
  section5.4: "ImageNet-1k experiments are not reproduced"
  appendix_e.5: "Continual learning experiments are not reproduced"
  appendix_e.6: "Streaming / online settings are not reproduced"
