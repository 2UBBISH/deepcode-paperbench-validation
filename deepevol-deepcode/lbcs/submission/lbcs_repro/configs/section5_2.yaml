# =============================================================================
# Section 5.2 configuration overlay -- "Comparison with the Competitors"
# (Table 2 and Table 3 of the paper)
# -----------------------------------------------------------------------------
# This file is a *declarative overlay*: it deep-merges on top of
# `configs/default.yaml` and only lists deltas / protocol values that the
# Section 5.2 experiment driver (`lbcs_repro.experiments.table2_table3_compare`)
# consumes.  Nothing here is algorithm code; changing a value here must be
# enough to change the experiment without touching `lbcs/`, `baselines/`,
# or `experiments/`.
#
# Provenance tags:
#   # PAPER      -> value stated explicitly in the paper / appendix
#   # SUGGESTED  -> reproduction default chosen because the paper is silent
#                   (exposed here so it can be overridden without code edits)
# =============================================================================

inherit:
  - default.yaml

driver: lbcs_repro.experiments.table2_table3_compare
entrypoint: run_table2_table3

# ---------------------------------------------------------------------------
# Runtime / IO
# ---------------------------------------------------------------------------
seed: 0                       # PAPER: "All experiments are repeated ten times" -> per-repeat seeds derived as seed+repeat*7919
device: null                  # SUGGESTED: null -> auto-select cuda if available, else cpu
num_workers: 0                # SUGGESTED
data_root: null               # SUGGESTED: null -> torchvision default root (env LBCS_DATA_ROOT overrides)
output_dir: results/table2_table3
save_artifacts: true          # SUGGESTED
plot: false                   # SUGGESTED: Table 2/3 are tables, not figures
verbose: false

logging:
  level: INFO
  log_every: 25               # SUGGESTED
  to_file: true
  file_name: table2_table3.log

# ---------------------------------------------------------------------------
# LBCS core (Algorithm 1) -- Section 5.2 protocol
# ---------------------------------------------------------------------------
lbcs:
  epsilon: 0.2                # PAPER: "The parameters epsilon and T are set to 0.2 and 500."
  T: 500                      # PAPER
  k: 1000                     # PAPER: first predefined coreset size of the sweep
  delta_init: 0.1             # SUGGESTED (paper gives no number for delta_init)
  delta_lower: 0.001          # SUGGESTED (paper gives no number for delta_lower)
  warm_start: true            # SUGGESTED: Section 3.2 acceleration trick (i)
  group_size: 1               # SUGGESTED: no grouping -> full example-level search space
  cache_evaluations: true     # SUGGESTED
  cache_theta: false          # SUGGESTED
  pretrain_random_masks: false  # SUGGESTED

# ---------------------------------------------------------------------------
# Inner loop (coreset selection) -- Section 5.2
# ---------------------------------------------------------------------------
inner:
  optimizer: adam             # PAPER: "An Adam optimizer (Kingma & Ba, 2015) is used with a learning rate of 0.001 for the inner loop."
  lr: 0.001                   # PAPER
  momentum: 0.9               # SUGGESTED (unused by Adam; kept for parity with drivers)
  weight_decay: 0.0           # SUGGESTED
  epochs: 100                 # PAPER: inner loop trained "until convergence"; the paper trains 100 epochs elsewhere
  batch_size: 128             # SUGGESTED
  eval_batch_size: 256        # SUGGESTED
  scheduler: null             # SUGGESTED

# ---------------------------------------------------------------------------
# Proxy (inner-loop) architectures -- Section 5.2
#   "we employ a LeNet for F-MNIST and simple convolutional neural networks
#    (CNNs) for SVHN and CIFAR-10."
# ---------------------------------------------------------------------------
proxy:
  F-MNIST: LeNet              # PAPER (model family); exact widths -> Appendix D.2 Table 7 (SUGGESTED defaults in models/lenet.py)
  SVHN: SVHNCNN               # PAPER (model family); widths SUGGESTED
  CIFAR-10: CIFARCNN          # PAPER (model family); widths SUGGESTED

# ---------------------------------------------------------------------------
# Target (post-selection) training -- Section 5.2
#   "we utilize a LeNet (LeCun et al., 1998) for F-MNIST, a CNN for SVHN, and
#    a ResNet-18 network for CIFAR-10 respectively.  In addition, for F-MNIST
#    and SVHN, an Adam optimizer is used with a learning rate of 0.001 and 100
#    epochs.  For CIFAR-10, an SGD optimizer is exploited with an initial
#    learning rate of 0.1 and a cosine rate scheduler.  200 epochs are set
#    totally."
# ---------------------------------------------------------------------------
target:
  F-MNIST:
    architecture: LeNet       # PAPER
    optimizer: adam           # PAPER
    lr: 0.001                 # PAPER
    epochs: 100               # PAPER
    momentum: 0.9             # SUGGESTED
    weight_decay: 0.0         # SUGGESTED
    scheduler: null           # PAPER (none stated for F-MNIST)
    batch_size: 128           # SUGGESTED
  SVHN:
    architecture: SVHNTargetCNN  # PAPER: "a CNN for SVHN" (family); widths SUGGESTED
    optimizer: adam           # PAPER
    lr: 0.001                 # PAPER
    epochs: 100               # PAPER
    momentum: 0.9             # SUGGESTED
    weight_decay: 0.0         # SUGGESTED
    scheduler: null           # PAPER (none stated for SVHN)
    batch_size: 128           # SUGGESTED
  CIFAR-10:
    architecture: ResNet18    # PAPER
    optimizer: sgd            # PAPER
    lr: 0.1                   # PAPER: "initial learning rate of 0.1"
    epochs: 200               # PAPER: "200 epochs are set totally"
    momentum: 0.9             # PAPER: standard SGD momentum for ResNet (also used in Appendix C.3)
    weight_decay: 0.0005      # SUGGESTED
    scheduler: cosine         # PAPER: "a cosine rate scheduler"
    batch_size: 128           # SUGGESTED

# ---------------------------------------------------------------------------
# Baseline suite -- Section 5.2 competitors (Appendix D.1 for technical detail)
# ---------------------------------------------------------------------------
baselines:
  suite:                      # PAPER: the seven competitors listed in Section 5.2
    - Uniform                 # (i)
    - EL2N                    # (ii)
    - GraNd                   # (iii)
    - Influential             # (iv)
    - Moderate                # (v)
    - CCS                     # (vi)
    - Probabilistic           # (vii) Zhou et al. 2022
  uniform:
    stratified: false         # SUGGESTED: class-agnostic random subset
  el2n:
    reference_epochs: 100     # SUGGESTED: proxy trained before scoring
    n_train_epochs: 1         # PAPER-ish: single-pass EL2N error vector
    reduction: norm           # PAPER: "large norms of predicted-class-probability minus one-hot error vectors"
    optimizer: adam           # SUGGESTED (matches Section 5.2 inner loop)
    lr: 0.001                 # SUGGESTED (matches Section 5.2 inner loop)
  grand:
    reference_epochs: 100     # SUGGESTED
    param_scope: last_layer   # PAPER-ish: "large loss-gradient norms during training"
    reduction: norm           # PAPER
    optimizer: adam           # SUGGESTED
    lr: 0.001                 # SUGGESTED
  influential:
    reference_epochs: 100     # SUGGESTED
    param_scope: last_layer   # SUGGESTED
    hessian_approx: diag      # SUGGESTED: diagonal Fisher/Hessian approximation
    damping: 0.01             # SUGGESTED
    normalize: false          # SUGGESTED
    lr: 0.001                 # SUGGESTED
  moderate:
    reference_epochs: 100     # SUGGESTED
    metric: l2                # PAPER: "score is distance to class center"
    median_mode: class        # PAPER-ish: select scores near the score median, per class
    normalize_features: false # SUGGESTED
    lr: 0.001                 # SUGGESTED
  ccs:
    reference_epochs: 100     # SUGGESTED
    importance: l2            # SUGGESTED
    alpha: 0.5                # SUGGESTED: balance coverage vs. importance
    preserve_distribution: true  # PAPER-ish: "coverage-plus-importance" one-shot selection
    normalize_features: true  # SUGGESTED
    lr: 0.001                 # SUGGESTED
  probabilistic:
    lambda: 0.5               # PAPER: Zhou et al. 2022 weighted objective (Eq. (4) form)
    outer_iters: 500          # SUGGESTED (paper states 1000 for Figure 1 only)
    outer_lr: 2.5             # PAPER (Appendix C.3 outer Adam lr)
    cosine: true              # PAPER (Appendix C.3 cosine schedule)
    inner_optimizer: adam     # SUGGESTED (matches Section 5.2 inner loop)
    inner_lr: 0.001           # SUGGESTED
    inner_epochs: 100         # SUGGESTED

# ---------------------------------------------------------------------------
# Table 2 / Table 3 protocol
# ---------------------------------------------------------------------------
table2:
  datasets: [F-MNIST, SVHN, CIFAR-10]   # PAPER
  ks: [1000, 2000, 3000, 4000]          # PAPER: "various predefined coreset sizes"
  epsilon: 0.2                          # PAPER
  T: 500                                # PAPER
  repeats: 10                           # PAPER: "All experiments are repeated ten times"
  architecture:                         # proxy/target pairs from `proxy` / `target` above
    F-MNIST: LeNet
    SVHN: SVHNCNN
    CIFAR-10: CIFARCNN
  f1_eval_split: train                  # SUGGESTED: f1(m) evaluated on the full training split
  track: [accuracy, coreset_size, accuracy_per_point, f1, f2]
  table3: true                          # PAPER: second kind of comparison reuses LBCS-achieved sizes
  per_point_table: true                 # PAPER: "average accuracy brought by per data point ... in Appendix E.1"

