# =============================================================================
# BBox-Adapter configuration -- StrategyQA
# -----------------------------------------------------------------------------
# Paper anchors:
#   * StrategyQA two-shot step-by-step prompt ending in "#### Yes./No." (App. J)
#   * splits 2059 train / 229 test (App. F.1 / Table 9)
#   * adapter backbone microsoft/deberta-v3-base (0.1B) / -large (0.3B) (App. E)
#   * Appendix H.2 hyperparameters (LR 5e-6, batch 64, 6000 steps, AdamW wd .01,
#     beam size 3, max length 512, temperature 1.0)
# Paper-silent knobs carry documented defaults (alpha, T, M, K, warmup, ...).
#
# This file is a complete, standalone config: it can be loaded on its own
# (`yaml.safe_load`) or deep-merged on top of `default.yaml`.
# =============================================================================

name: bbox_adapter_strategyqa
dataset: strategyqa
size: 0.1b                      # 0.1b -> deberta-v3-base, 0.3b -> deberta-v3-large
backbone: null                  # null => resolved from (dataset, size)
seed: 0
output_dir: runs/strategyqa

# --- Data ---------------------------------------------------------------------
data:
  name: strategyqa
  hf_path: wics/strategy-qa
  hf_config: null
  train_split: train
  test_split: test
  n_train: 2059
  n_test: 229
  question_field: question
  answer_field: answer
  answer_type: yesno           # "Yes" / "No"
  prompt_key: strategyqa
  metric: accuracy
  n_shot: 2                    # Appendix J: two-shot step-by-step
  drop_instruction_models: [mixtral, davinci]
  use_terminator: true
  terminator: "####"

# --- Black-box proposal generator (text only: no logprobs / echo) -------------
blackbox:
  model: gpt-3.5-turbo
  kind: bbox                   # bbox | sft | cot | toxigen (temperature regime)
  max_len: 512
  temperature: 1.0             # App. H.2
  top_p: 1.0
  n: 1
  allow_mock: true             # fall back to MockLLMClient without credentials

# --- Energy adapter g_theta(x, y) -> scalar -----------------------------------
adapter:
  backbone: null               # resolved: deberta-v3-base (0.1b) / -large (0.3b)
  pooling: null                # null => "mean" for DeBERTa-v3, "cls" for BERT
  head_hidden: 0               # 0 => Dropout + Linear(H, 1)
  dropout: 0.0
  freeze_backbone: false
  max_length: 512
  output_scale: 1.0
  head_init_std: 0.02
  size: 0.1b

# --- Ranking-based NCE loss (Eq. 2 / Eq. 3) -----------------------------------
loss:
  name: nce                    # nce | mlm (Table 5 ablation)
  alpha: 0.01                  # Eq. (3) regularizer; paper-silent, sweep {1e-3,1e-2,1e-1}
  reduction: mean
  temperature: 1.0
  label_smoothing: 0.0
  energy_clamp: null
  reg_mode: split              # apply alpha*E[g^2] to positives and negatives separately
  reg_schedule: constant
  reg_warmup_steps: 0
  use_regularizer: true

# --- Algorithm 1: online adaptation ------------------------------------------
training:
  lr: 5.0e-6                   # eta, Eq. (7)
  batch_size: 64
  max_train_steps: 6000        # total mini-batch gradient steps
  weight_decay: 0.01
  betas: [0.9, 0.999]
  max_grad_norm: 1.0
  schedule: constant
  warmup_fraction: 0.1
  n_iterations: 4              # T (Fig. 3b plateau); paper-silent default
  n_candidates: 5              # M candidates sampled per outer iteration
  k_init: 5                    # K initial responses per query
  samples_per_beam: 2          # n sentence samples per beam per step
  use_beam_search: true
  outcome_supervision: true
  sel_mode: ground_truth       # ground_truth | ai_feedback | combined | random
  device: auto
  log_every: 50
  eval_every: 1
  save_every: 0

# --- Adapted inference: sentence-level beam search (Eq. 4) ---------------------
beam_search:
  beam_size: 3                 # default beam size
  n_samples: 2                 # n samples per beam per sentence step
  max_steps: 6
  stop_signal: "####"
  temperature: 1.0
  max_len: 512
  normalization: none
  length_penalty: 0.0
  deduplicate: true
  stop_when_all_complete: true
  include_prompt_in_energy: true
  keep_candidates: true

# --- Positive / negative buffers (Eq. 5, Eq. 6) -------------------------------
buffer:
  sel_mode: ground_truth
  k_init: 5
  m_candidates: 5
  max_positives: 8
  max_negatives: 64
  deduplicate: true
  outcome_supervision: true
  ai_feedback_n_ranked: 5

# --- GPT-4 AI feedback rater (Appendix G) ------------------------------------
feedback:
  enabled: true                # required for ai_feedback / combined SEL modes
  model: gpt-4
  temperature: 0.0
  n_ranked: 5
  retries: 2
  fallback: majority
  prompt_style: best           # StrategyQA uses the "Best Answer and Explanation" format
  criteria: [Coherency, Reasonability, Correctness, Format]

# --- Evaluation ---------------------------------------------------------------
eval:
  metric: accuracy             # Accuracy (%) for StrategyQA
  n_test: 229
  gpt_judge: false
  toxicity_threshold: 0.5
  report_delta: true           # Delta% vs. unadapted black-box model
  num_seeds: 1                 # Table 10 standard deviations need >1

# --- Baselines -----------------------------------------------------------------
baselines:
  cot:
    enabled: true
    temperature: 0.0           # baseline decoding is greedy
    n_shot: 2
  azure_sft:
    enabled: false
    model: gpt-3.5-turbo
    epochs: 3                  # Appendix F.2 (note the H.2 5-epoch discrepancy)
    batch_size: null           # Azure default
    lr_multiplier: null        # Azure default
  sft_lora:
    enabled: false
    model: mistralai/Mixtral-8x7B-v0.1
    lora_r: 128                # 0.1B-equivalent (r=384 for 0.3B-equivalent)
    lora_alpha: 256            # alpha = 2r
    lora_dropout: 0.1
    lr: 2.0e-4
    weight_decay: 0.001
    batch_size: 8
    grad_accum: 1
    max_grad_norm: 0.3
    epochs: 3
    optimizer: paged_adamw_32bit
    lr_scheduler: cosine
    max_length: 512

# --- Cost accounting (Table 4, $/1k questions) --------------------------------
cost:
  enabled: true
  model_for_pricing: gpt-3.5-turbo-1106
  usd_per_1k_input_tokens: 0.0015
  usd_per_1k_output_tokens: 0.002
  per_questions: 1000

# --- VRAM accounting (Table 6; 0.1B only per Addendum) -------------------------
vram:
  enabled: false
  report_only_0_1b: true
