# =============================================================================
# NetHack Human Monk fine-tuning configuration
# -----------------------------------------------------------------------------
# Reproduces the NetHack track of:
#   "Fine-tuning Reinforcement Learning Models is Secretly a Forgetting
#    Mitigation Problem" (Wolczyk et al., 2024)
#
# Sources of truth:
#   * Table 1            -> `appo` block (APPO / Adam hyperparameters)
#   * Section 3, App. B.1 -> fine-tuning protocol, encoders frozen, entropy off
#                            when a retention method is active
#   * Section 2, App. C  -> retention coefficients (EWC 2e6, BC 2.0, KS 0.5
#                            with 0.99998 per-step decay), Fisher (10000
#                            NLD-AA batches of size 128)
#   * Section 5, App. B.1 -> evaluation (1000 episodes; stop on death, 150
#                            steps without progress, or 100k steps) and
#                            per-level AutoAscend evaluation every 25M steps
# =============================================================================

name: nethack
env_name: nethack
wandb_project: finetuning-rl-as-cl
# Single global seed; multi-seed runs are driven by `experiment.seeds`.
seed: 0

logging:
  log_every: 1000000          # environment steps between log lines
  save_every: 25000000        # checkpoint every 25M env steps
  eval_every: 25000000        # evaluation every 25M env steps
  use_tensorboard: true
  use_wandb: false

# -----------------------------------------------------------------------------
# Environment (NLE)
# -----------------------------------------------------------------------------
env:
  env_id: NetHackChallenge-v0
  character: human-monk
  num_envs: 128                 # parallel NetHack environments
  max_episode_steps: 100000     # evaluation cap (Section 5)
  no_progress_steps: 150        # stop after 150 steps without progress
  observation_keys: [tty_chars, tty_colors, blstats, message]
  # `stub: true` swaps in the dependency-free CPU MiniNetHackVecEnv so the whole
  # pipeline can be smoke-tested without NLE / a GPU.
  stub: false

# -----------------------------------------------------------------------------
# Pre-trained checkpoint pi_* (Tuyls et al., 2023, 30M-step LSTM model)
# -----------------------------------------------------------------------------
pretrained:
  checkpoint: checkpoints/nethack/human_monk_30M_lstm.pt
  # A randomly initialised policy scores ~26; pi_* scores ~5K on Human Monk.
  expected_score: 5000.0
  lr: 0.0001
  discounting: 0.999999
  reward_clip: 10.0
  # Verification of pi_* before starting any fine-tuning (Section 5).
  verify: true
  verify_episodes: 50

# -----------------------------------------------------------------------------
# Frozen observation encoders + LSTM backbone (Appendix B.1)
# -----------------------------------------------------------------------------
model:
  main_screen_shape: [24, 80]
  blstats_shape: [25]
  message_shape: [256, 128]
  num_actions: 120
  # Shared backbone width used for the LSTM, blstats MLP and message MLP.
  hidden_dim: 1738
  lstm_layers: 1
  lstm_hidden_dim: 1738
  activation: relu
  char_embed_dim: 32
  color_embed_dim: 16
  screen_channels: 48
  resnet_blocks: 2
  # Appendices B.1: "we froze the encoders during the course of the training".
  freeze_encoders: true
  device: auto

# -----------------------------------------------------------------------------
# Baseline-head (critic) pre-training (Appendix B.1)
# -----------------------------------------------------------------------------
baseline:
  agent_name: baseline
  # Only the baseline head is trained; the rest of the network is frozen.
  pretrain_steps: 500000000
  learning_rate: 0.0001
  baseline_cost: 1.0
  appo_clip_baseline: 1.0
  grad_norm_clipping: 4.0
  discounting: 0.999999
  reward_clip: 10.0
  save_every: 25000000
  checkpoint: checkpoints/nethack/human_monk_baseline_head.pt

# -----------------------------------------------------------------------------
# APPO fine-tuning hyperparameters -- Table 1
# -----------------------------------------------------------------------------
appo:
  # Table 1 (paper) verbatim:
  learning_rate: 0.0001
  batch_size: 128
  unroll_length: 32
  discounting: 0.999999
  entropy_cost: 0.001
  baseline_cost: 1.0
  reward_clip: 10.0
  reward_scale: 1.0
  grad_norm_clipping: 4.0
  appo_clip_policy: 0.1
  appo_clip_baseline: 1.0
  num_epochs: 1
  num_batches_per_epoch: 1
  normalize_advantage: true
  use_gae: true
  gae_lambda: 0.95
  optimizer: adam
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-7
  weight_decay: 0.0001
  num_workers: 128
  # Total fine-tuning budget: the paper trains >500M environment steps.
  total_steps: 500000000
  # snake_case aliases kept for config loaders that expect them.
  lr: 0.0001
  gamma: 0.999999
  batch: 128
  unroll: 32
  entropy: 0.001
  clip_ratio: 0.1
  clip_grad_norm: 4.0
  lam: 0.95
  device: auto
  seed: 0
  stub: false

# -----------------------------------------------------------------------------
# Knowledge-retention variants
# -----------------------------------------------------------------------------
# Training variants compared in Figures 3a and 5 and Table 4:
#   scratch : from-scratch APPO, never sees pi_* or the NLD-AA data (~776)
#   none    : vanilla fine-tuning of pi_* (degrades on FAR states)
#   ewc     : fine-tuning + EWC penalty on the actor (~3976)
#   bc      : fine-tuning + behavioral cloning on the actor (~7610)
#   ks      : fine-tuning + kickstarting on the actor (~10588 +/- 672)
training:
  methods: [scratch, none, ewc, bc, ks]
  total_steps: 500000000

retention:
  method: bc
  # Appendix B.1 / C: retention is always applied to the actor only.
  apply_to: actor
  critic_coef: 0.0
  # Entropy bonus is disabled whenever a retention method is active.
  disable_entropy_with_retention: true
  # Retention is never applied to the critic; critics keep their RL coefficient.
  freeze_critic_regularization: true

  ewc:
    actor_coef: 2000000.0        # 2e6 (Appendix C.1)
    critic_coef: 0.0
    # Fisher estimated from 10000 NLD-AA batches of size 128 (Appendix C.1)
    num_batches: 10000
    batch_size: 128
    mode: expert                 # squared gradient of expert log-likelihood
    normalize: false

  bc:
    actor_coef: 2.0              # Appendix C.2, no decay
    critic_coef: 0.0
    memory_size: 10000           # 10000 NLD-AA pre-training states
    batch_size: 128
    direction: forward           # D_KL^s(pi_theta || pi_*) as in Appendix C.2
    loss_type: kl
    decay: null
    decay_type: none

  ks:
    actor_coef: 0.5              # Appendix C.2
    critic_coef: 0.0
    direction: reverse           # D_KL^s(pi_* || pi_theta)
    loss_type: kl
    batch_size: 128
    memory_size: 10000           # online policy states B_theta
    decay: 0.99998               # multiplicative, applied every train step
    decay_type: exponential
    min_coef: 0.0

  em:
    actor_coef: 0.0              # Episodic memory adds no auxiliary loss
    critic_coef: 0.0
    memory_size: 100000          # 100k-transition replay buffer
    fraction: 0.1                # 10% locked for pi_* transitions
    protected: true

# -----------------------------------------------------------------------------
# NLD-AA dataset (Appendix B.1)
# -----------------------------------------------------------------------------
dataset:
  name: nld-aa-v0
  num_shards: 16
  num_episodes: 8000             # ~8000 Human Monk games
  batch_size: 128
  seq_length: 1
  data_dir: data/nld-aa
  download: false
  register: true
  url_base: https://dl.fbaipublicfiles.com/nld/nld-aa/
  # Number of batches used to accumulate the diagonal Fisher.
  fisher_batches: 10000

# -----------------------------------------------------------------------------
# Fine-tuning loops
# -----------------------------------------------------------------------------
finetune:
  methods: [none, ewc, bc, ks, scratch]
  total_steps: 500000000
  eval_every: 25000000           # evaluation every 25M environment steps
  eval_episodes: 1000            # full 1000-episode evaluation
  save_every: 25000000           # checkpoint every 25M steps
  log_every: 1000000
  # Section 5 stopping criteria.
  max_steps: 100000
  no_progress_steps: 150
  per_level_eval: true
  per_level_every: 25000000
  checkpoint: null

# -----------------------------------------------------------------------------
# Evaluation: full-game + per-level (Section 5, Appendix B.1)
# -----------------------------------------------------------------------------
eval:
  episodes: 1000
  num_seeds: 3
  confidence: 0.90
  max_steps: 100000
  no_progress_steps: 150
  deterministic: true
  metrics:
    - score
    - turns
    - steps
    - dlvl
    - xplvl
    - eating
    - gold
    - scout
    - staircase
  per_level:
    enabled: true
    # Targets evaluated by launching the agent from the expert's finishing state.
    levels: [level_4, sokoban]
    num_saves: 200               # 200 AutoAscend saves per level
    num_episodes: 200
    every: 25000000              # every 25M environment steps
    save_dir: data/autoascend_saves
    # Report the score achieved on top of the expert's score.
    count_from_expert: true
    autoascend:
      repo: https://github.com/cdmatters/autoascend
      branch: jt-nld
      env_var: AUTOASCEND_PATH
      command: null

# -----------------------------------------------------------------------------
# Compute
# -----------------------------------------------------------------------------
compute:
  device: auto                   # NVIDIA A100-class GPU recommended
  num_workers: 8
  torch_threads: 8
  gpu_vram: 40
