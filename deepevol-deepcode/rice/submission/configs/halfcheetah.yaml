# =============================================================================
# RICE -- per-application config: HalfCheetah-v3 (dense MuJoCo)
# -----------------------------------------------------------------------------
# Merged on top of configs/default.yaml by rice.utils.io.get_config("halfcheetah").
#
# Paper references:
#   * Env id HalfCheetah-v3, obs_dim 17, action_dim 6, horizon T = 1000   (Sec. 4.1 / App. C.2)
#   * Observation normalization applies to HalfCheetah                  (App. C.2)
#   * Sparse variant threshold = 5.0 (forward x-position)                (App. C.2)
#   * Mask-net sample budget = 300,000                                   (Table 4)
#   * Refinement: p = 0.5, lam = 0.01, alpha = 0.0001 (Table 3; alpha insensitive)
#
# NOTE: `expected_return` / `expected_std` are reference points used ONLY to
# validate trends (the addendum states exact numbers are not required).
# =============================================================================

name: halfcheetah

env:
  id: halfcheetah
  gym_id: "HalfCheetah-v3"
  app: mujoco
  discrete_actions: false
  # HalfCheetah is one of the two environments the paper normalizes (App. C.2).
  normalize_obs: true
  sparse: false
  sparse_threshold: 5.0
  max_episode_steps: 1000
  # Max single-episode reward, used as `d_max` in
  # fidelity = log(d / d_max) - log(l / L)  (Sec. 4.1).
  d_max: 5000.0
  obs_dim: 17
  action_dim: 6

target:
  algo: ppo
  policy: MlpPolicy
  # SB3 default MlpPolicy = 2 x 64 tanh (addendum "Architectures").
  hidden_sizes: [64, 64]
  activation: tanh
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_epochs: 10
  batch_size: 64
  n_steps: 2048
  total_timesteps: 1000000
  checkpoint: "policies/halfcheetah_ppo.zip"
  # Reference values for the pre-trained (bottlenecked) policy -- trend check only.
  expected_return: 4540.50
  expected_std: 305.20

explanation:
  enabled: true
  method: ours              # ours | random | statemask | ig | airs
  hidden_sizes: [64, 64]
  activation: tanh
  # Table 3 value; alpha is insensitive (Fig. 9), the 0.01 in Sec. 4.3 prose is
  # exposed through `alpha_sweep` for the sensitivity study only.
  alpha: 1.0e-4
  use_blinding_bonus: true
  reward_mode: augmented    # R'_t = R(s_t, a_t) + alpha * a_t^m
  total_timesteps: 300000   # Table 4 mask-net sample budget
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_epochs: 10
  batch_size: 64
  # Fidelity sliding-window fraction l = L x K (Sec. 4.1); default 10%.
  K: 0.1
  checkpoint: "policies/halfcheetah_mask.pt"

fidelity:
  K_values: [0.10, 0.20, 0.30, 0.40]
  n_trajectories: 500
  seeds: [0, 1, 2]
  deterministic_policy: true
  action_mode: random
  scoring: auto             # auto -> "mask" when a mask net exists, else "random"
  window_metric: mean       # highest AVERAGE importance window
  max_tail_steps: null
  store_details: false

refine:
  enabled: true
  method: ours              # ours | ppo_finetune | statemask_r | jsrl | sac | gail | sil
  p: 0.5                    # reset-to-critical probability (= mixture weight beta)
  lam: 0.01                 # RND bonus coefficient
  use_mixed_init: true
  use_rnd: true
  # K defaults to the episode horizon T when null (Algorithm 2 ambiguity rule).
  K: null
  copy_policy: true         # keep pi frozen, train pi_theta from it
  total_timesteps: 200000
  lr: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  n_epochs: 10
  batch_size: 64
  n_steps: null
  eval_episodes: 10
  deterministic_eval: true
  # Reference refined return -- trend check only (Ours should beat No-Refine).
  expected_return: 4663.75
  expected_std: 305.20

rnd:
  hidden_sizes: [64, 64]
  activation: tanh
  lr: 1.0e-4
  lam: 0.01
  normalize: true
  normalization: running_std   # divide by running std of prediction error
  clip_bonus: null
  update_epochs: 1
  batch_size: 256
  reward_scale: 1.0

sparse:
  env_id: sparse_halfcheetah
  gym_id: "SparseHalfCheetah-v0"
  sparse: true
  sparse_threshold: 5.0
  d_max: 5000.0
  normalize_obs: true
  refine:
    total_timesteps: 200000
    eval_episodes: 10

experiments:
  exp1:
    envs: [halfcheetah]
    K_values: [0.10, 0.20, 0.30, 0.40]
    n_trajectories: 500
    seeds: [0, 1, 2]
    mask_samples: 300000
    # Table 4 reference mask-training wall-clock (Ours vs StateMask, seconds).
    expected_train_time_s: {ours: 1317, statemask: 1579}
  exp2:
    envs: [halfcheetah, sparse_halfcheetah]
    methods: [ours, ppo_finetune, statemask_r, jsrl]
  exp3:
    envs: [halfcheetah]
    explanations: [random, statemask, ours]
  exp4:
    envs: [halfcheetah]
  exp5:
    envs: [halfcheetah]
    p_sweep: [0.0, 0.25, 0.5, 0.75, 1.0]
    lam_sweep: [0.0, 0.1, 0.01, 0.001]
    alpha_sweep: [0.01, 0.001, 0.0001]
